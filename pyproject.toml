[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "codeguard-cli"
dynamic = ["version"]
description = "Fast, offline multi-language static analysis for security anti-patterns (Python, JS, TS)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "CodeGuard Contributors" }]
requires-python = ">=3.10"
keywords = ["static-analysis", "security", "linting", "ast", "sast", "sarif"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pathspec>=0.12",
    "platformdirs>=4.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "mypy>=1.7",
    "ruff>=0.4",
    "pre-commit>=3.6",
    "build>=1.2",
    "towncrier>=24.8",
    "pip-audit>=2.7",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocs-gen-files>=0.5",
]

[project.scripts]
codeguard = "codeguard.cli.main:cli"

[project.urls]
Homepage = "https://github.com/mevichitra/codeguard"
"Bug Tracker" = "https://github.com/mevichitra/codeguard/issues"
"Security" = "https://github.com/mevichitra/codeguard/security"
Documentation = "https://github.com/mevichitra/codeguard/tree/main/docs"

[tool.hatch.version]
path = "src/codeguard/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/codeguard"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "benchmarks/", "docs/", "README.md", "LICENSE", "CHANGELOG.md"]

# ---------------------------------------------------------------------------
# Ruff — linting + formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (ironic: we use bandit rules to lint ourselves)
    "RUF", # ruff-specific rules
]
ignore = [
    "S101",   # assert in tests is fine
    "S603",   # subprocess without shell — we're testing this explicitly in rules
    "S607",   # partial executable path — same
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "N"]              # security and naming rules relaxed in tests
"tests/fixtures/*" = ["ALL"]        # fixtures are intentionally vulnerable code
"benchmarks/corpus/*" = ["ALL"]     # corpus samples are intentionally vulnerable code

[tool.ruff.lint.isort]
known-first-party = ["codeguard"]

# ---------------------------------------------------------------------------
# Mypy — strict type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
files = ["src/"]
exclude = ["tests/fixtures/"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "error",
    "ignore::SyntaxWarning",   # fixtures may have intentional syntax issues
]

# ---------------------------------------------------------------------------
# Towncrier — changelog assembled from news fragments in changelog.d/
# ---------------------------------------------------------------------------
[tool.towncrier]
name = "CodeGuard"
package = "codeguard"
package_dir = "src"
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
underlines = ["", "", ""]
ignore = ["README.md"]
title_format = "## [{version}] - {project_date}"
issue_format = "[#{issue}](https://github.com/mevichitra/codeguard/issues/{issue})"

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking changes"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "doc"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "internal"
name = "Internal"
showcontent = true

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["codeguard"]
branch = true
omit = ["src/codeguard/cli/main.py"]  # CLI tested via integration, not coverage

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
