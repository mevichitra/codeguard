id = "codeguard"
name = "CodeGuard"
version = "0.2.0"
schema_version = 1
authors = ["CodeGuard Contributors"]
description = "Local security (with taint tracking), performance, and code-quality diagnostics with quick fixes for Python, JavaScript, and TypeScript"
repository = "https://github.com/mevichitra/codeguard"

[lib]
kind = "Rust"
version = "0.7.0"

[language_servers.codeguard]
name = "CodeGuard"
languages = ["Python", "JavaScript", "JSX", "TypeScript", "TSX"]
code_action_kinds = ["quickfix", "source.fixAll.codeguard", "source.codeguard.dashboard"]

[language_servers.codeguard.language_ids]
Python = "python"
JavaScript = "javascript"
JSX = "javascriptreact"
TypeScript = "typescript"
TSX = "typescriptreact"
