# archive/ holds unmaintained prototypes; tests/fixtures/ and benchmarks/corpus/
# hold intentionally vulnerable sample code. All are excluded from every hook.
exclude: ^(archive/|tests/fixtures/|benchmarks/corpus/)

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        args: [--strict]
        additional_dependencies:
          - click
          - rich
          - pathspec
          - platformdirs
          - tree-sitter
          - tree-sitter-javascript
          - tree-sitter-typescript
        files: ^src/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: insert-license
        files: \.py$
        exclude: ^tests/fixtures/
        args:
          - --license-filepath
          - .license-header.txt
          - --comment-style
          - "#"

  # Dogfood our own consumer hooks.
  - repo: local
    hooks:
      - id: codeguard
        name: CodeGuard (self)
        entry: codeguard scan
        language: system
        types_or: [python, javascript, jsx, ts, tsx]
        exclude: ^(tests/fixtures/|benchmarks/corpus/|examples/|archive/)
        args: ["--quiet"]
