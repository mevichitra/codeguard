name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: mypy src/

  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --cov=codeguard --cov-report=term-missing
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false

  build-smoke:
    name: Build & install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install build
      - run: python -m build
      - name: Install the wheel into a clean venv and run it
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/codeguard --version
          /tmp/smoke/bin/codeguard list-rules
          # Python and JavaScript scanning both work from the installed wheel.
          /tmp/smoke/bin/codeguard scan tests/fixtures/python/security/cg_sec_001/vulnerable.py && exit 1 || test $? -eq 1
          /tmp/smoke/bin/codeguard scan examples/vulnerable_example.js && exit 1 || test $? -eq 1
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docs:
    name: Docs (mkdocs --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[docs]"
      - run: mkdocs build --strict

  changelog:
    name: News fragment present
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a changelog.d fragment when src/ changes
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          changed=$(git diff --name-only "$base" HEAD)
          if echo "$changed" | grep -qE '^src/codeguard/'; then
            if ! echo "$changed" | grep -qE '^changelog\.d/.+\.(breaking|feature|bugfix|doc|internal)\.md$'; then
              echo "::error::This PR changes src/ but adds no changelog.d/ fragment. See changelog.d/README.md."
              exit 1
            fi
          fi

  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No references to the old GitHub org
        run: |
          if grep -rn "codeguard-ai/codeguard" --include='*.py' --include='*.toml' \
               --include='*.md' --include='*.yml' --include='*.yaml' . \
               | grep -v '^\./archive/'; then
            echo "::error::Found codeguard-ai/codeguard outside archive/. Use mevichitra/codeguard."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pip-audit
      - name: Audit runtime dependencies
        run: pip-audit --progress-spinner off --skip-editable

  self-scan:
    name: CodeGuard self-scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: codeguard scan src/ --format sarif -o codeguard.sarif || true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: codeguard.sarif
